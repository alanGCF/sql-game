# Llamadas que le haces a Don Chuy (Mantenimiento, ext. 301), F4-02.
contacto: don_chuy
conversaciones:
  - id: t1-leeme
    turnos: [1]
    requiere: leyo_leeme
    lineas:
      - Ah, joven. Me quedé pensando en la nota de la ingeniera. Esa muchacha sí bajaba a piso; se paraba junto a las líneas nomás a oírlas, como yo.
      - Yo de números no sé. Pero si una máquina me dice una cosa con el ruido y la pantalla dice otra, yo le creo al ruido.
  - id: general-prensa
    lineas:
      - Mantenimiento, habla Chuy Ortega. Ando con la prensa cuatro, que amaneció de malas.
      - Si no es urgente, al rato platicamos, joven.
  - id: general-ruido
    lineas:
      - "Mira, joven: máquina que no hace ruido, o está muy bien o está muy mal. Por eso yo las oigo antes de verlas."
    opciones:
      - texto: ¿Y cómo sabe cuál de las dos?
        respuesta:
          - Con los años, joven. La que cambia de ruido, algo trae. Y si no sé, pregunto; preguntando se llega a Roma.
      - texto: Lo voy a tener en cuenta.
        respuesta:
          - Así me gusta. Ándale, ahí nos vemos.
ponte_a_trabajar:
  - ¿Otra vez tú? ¿No tienes trabajo, joven? Ponte a trabajar, que el patrón no paga por platicar.
no_contesta: Nadie contesta en el taller. Don Chuy ha de andar metido debajo de alguna máquina.
