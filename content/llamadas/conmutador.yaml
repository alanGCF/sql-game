# Llamadas que le haces al conmutador (ext. 0), F4-02.
contacto: conmutador
conversaciones:
  - id: general-directorio
    lineas:
      - Conmutador, buenas. Las extensiones vienen en el directorio pegado en tu mampara. ¿A quién buscabas?
    opciones:
      - texto: A nadie, gracias.
        respuesta:
          - Con gusto. Que tengas buen turno.
      - texto: ¿Me puedes vocear a Eduardo?
        respuesta:
          - Si quieres lo voceo, pero en piso con el ruido de las máquinas ni se oye. Mejor márcale a la 214; el teléfono lo trae con él.
  - id: general-aviso
    lineas:
      - Conmutador, buenas.
      - "Aprovecho para el aviso del turno: el estacionamiento de visitas cierra a las diez. Que tengas buen turno."
ponte_a_trabajar:
  - Joven, la línea del conmutador es para trabajo. Ponte a trabajar, por favor.
no_contesta: El conmutador está ocupado. Ni modo.
