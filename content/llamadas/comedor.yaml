# Llamadas que le haces al comedor (ext. 150), F4-02.
contacto: comedor
conversaciones:
  - id: t1-menu
    turnos: [1]
    lineas:
      - Comedor, buenas tardes. Hoy hay discada y frijoles charros, mijo. La cena del turno es a las nueve; no llegues tarde, que se acaban las tortillas.
  - id: general-menu
    lineas:
      - Comedor, buenas. Hoy hay caldillo de papa con carne seca. ¿Te aparto un plato?
    opciones:
      - texto: Sí, por favor.
        respuesta:
          - Ándale pues. Nomás no me lo dejes enfriar.
      - texto: No, gracias, traje lonche.
        respuesta:
          - Ay, mijo. Ya te veré por aquí a las nueve con tu lonchera.
  - id: general-chisme
    lineas:
      - Aquí se oye todo, mijo. Dicen que la ingeniera de sistemas se fue sin despedirse de nadie… Ay, ya ni me hagas caso.
ponte_a_trabajar:
  - Ay, mijo, ¿otra vez? Aquí no es línea de quejas. Ándale a trabajar y luego vienes a comer.
no_contesta: Nadie contesta en el comedor. Han de estar sirviendo.
