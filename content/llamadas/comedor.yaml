# Llamadas que le haces al comedor (ext. 150), F4-02. Las generales no dicen qué hay "hoy".
contacto: comedor
conversaciones:
  - id: t1-menu
    turnos: [1]
    lineas:
      - Comedor, buenas. Hoy hay pozole rojo, corazón, con su tostadita y todo.
      - Vente antes de que se acabe, que aquí el pozole vuela.
  - id: general-menu
    lineas:
      - Comedor, buenas. ¿Ya comiste, corazón? Por la voz se te nota que no.
    opciones:
      - texto: Ahorita voy.
        respuesta:
          - Ándale pues. Te aparto un plato; nomás no me lo dejes enfriar.
      - texto: Traje lonche.
        respuesta:
          - Ay, corazón, el lonche no llena. Si te arrepientes, aquí hay comida.
  - id: general-chisme
    lineas:
      - Aquí se oye todo, corazón. Dicen que la ingeniera de sistemas se fue sin despedirse de nadie…
      - Ay, ya ni me hagas caso.
ponte_a_trabajar:
  - Ay, corazón, ¿otra vez? Tengo la olla en la lumbre. Ándale a trabajar y luego vienes a comer.
no_contesta: Nadie contesta en el comedor. Han de estar sirviendo.
