# Llamadas que le haces a Karla (Calidad, ext. 402), F4-02.
contacto: karla
conversaciones:
  - id: t1-ticket
    turnos: [1]
    lineas:
      - Calidad, Karla. ¿Es por mi ticket? Lo ocupo para mi reporte antes de que acabe el turno.
    opciones:
      - texto: Ya te lo contesté.
        respuesta:
          - Ah, va. Lo reviso entre junta y junta. Gracias.
      - texto: Ahorita lo busco.
        respuesta:
          - Porfa. Y si esa nota dice algo de Calidad, me avisas a mí primero, ¿sí?
  - id: general-junta
    lineas:
      - Calidad, Karla. Estoy por entrar a junta con Producción.
      - Si es de un ticket, contéstalo en la app y yo lo reviso.
  - id: general-reportes
    lineas:
      - Ahorita no puedo; ando cerrando los reportes del turno y todo tiene que cuadrar. ¿Era algo rápido?
    opciones:
      - texto: No, nada urgente.
        respuesta:
          - Va. Gracias por avisar.
      - texto: Nomás para presentarme.
        respuesta:
          - Ah, ¿tú eres quien entró a sistemas? Mucho gusto. Te voy a dejar tickets seguido; no es nada personal.
ponte_a_trabajar:
  - ¿Otra vez? De verdad estoy ocupada. Ponte a trabajar y deja de marcarme, ¿sí?
no_contesta: Entra el buzón de Karla. No le dejo mensaje; ya me dijo que está ocupada.
