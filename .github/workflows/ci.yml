name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 9 * * *" # nocturno (03:17 en Ciudad Juárez)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, pruebas, build y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  goldens:
    name: Goldens contra debian:stable (vigencia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:stable
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node scripts/capture-goldens.mjs
      # Si el sistema real cambió (nueva versión de coreutils/bash), las salidas difieren y hay que revisar.
      - run: git diff --exit-code -- tests/golden ':(exclude)tests/golden/**/version.txt'

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  imagen:
    name: Imagen Docker de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -t rastro .
      - name: Arranca como usuario sin privilegios y responde /healthz
        run: |
          docker run -d --name rastro -p 3000:3000 rastro
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi "content-security-policy"
          test "$(docker exec rastro id -un)" = node
          # El código es de root: el proceso solo puede leerlo.
          ! docker exec rastro touch /app/dist/escritura
