name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 9 * * *" # nocturno (03:17 en Ciudad Juárez)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, pruebas, build y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  goldens:
    name: Goldens contra debian:stable (vigencia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:stable
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs ca-certificates
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node scripts/capture-goldens.mjs
      # Si el sistema real cambió (nueva versión de coreutils/bash), las salidas difieren y hay que revisar.
      - run: git diff --exit-code -- tests/golden ':(exclude)tests/golden/**/version.txt'

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm audit --audit-level=high
