name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 9 * * *" # nocturno (03:17 en Ciudad Juárez)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, pruebas, build y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Postgres desechable para el contrato del repositorio de partidas (tests/server/repositorio.test.ts).
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
        env:
          PRUEBAS_PG_URL: postgresql://postgres:pruebas@localhost:5432/pruebas
      - run: npm run build
      - run: npm run size
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Capturas de referencia (F3-09): solo valen en el contenedor oficial de Playwright (mismas fuentes y
  # Chromium). Un push del dueño a develop con "[capturas]" en el último commit las regenera y las sube.
  # La imagen (etiqueta y digest) se actualiza a mano junto con @playwright/test: lo verifica un paso.
  capturas:
    name: Capturas de referencia (contenedor de Playwright)
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.actor == github.repository_owner && contains(github.event.head_commit.message, '[capturas]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: La versión de Playwright coincide con la imagen
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ "$v" != "1.63.0" ]; then
            echo "::error::@playwright/test $v no coincide con la imagen v1.63.0: actualiza container.image (etiqueta y digest)"
            exit 1
          fi
      # Sin referencias falla (Playwright no las crea en CI): no se aprueba nada en silencio.
      - name: Compara contra las referencias
        run: npx playwright test tests/e2e/capturas.spec.ts --project desktop-720
        env:
          CAPTURAS: "1"
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: capturas-diferencias
          path: test-results
          retention-days: 7

  capturas-generar:
    name: Regenerar capturas de referencia
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.actor == github.repository_owner && contains(github.event.head_commit.message, '[capturas]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: La versión de Playwright coincide con la imagen
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ "$v" != "1.63.0" ]; then
            echo "::error::@playwright/test $v no coincide con la imagen v1.63.0: actualiza container.image (etiqueta y digest)"
            exit 1
          fi
      - run: |
          rm -rf tests/e2e/capturas.spec.ts-snapshots
          npx playwright test tests/e2e/capturas.spec.ts --project desktop-720 --update-snapshots=all
        env:
          CAPTURAS: "1"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: capturas
          path: tests/e2e/capturas.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 3

  # Único job con escritura: no instala dependencias ni corre código del repo. El artefacto se trata como
  # hostil: se baja y se valida (nombres, cantidad, tamaños y estructura PNG) antes de que haya repo y token
  # en disco. Su commit llega a develop sin CI: se revisa (diff e imágenes) antes de llevar develop a main.
  capturas-subir:
    name: Subir capturas de referencia a develop
    needs: capturas-generar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capturas
          path: ${{ runner.temp }}/capturas
      - name: Valida las PNG (nombres, cantidad, tamaño y estructura)
        env:
          DIR: ${{ runner.temp }}/capturas
        shell: python3 -I {0}
        run: |
          import os, re, struct, sys, zlib
          carpeta = os.environ["DIR"]
          nombre_valido = re.compile(r"[a-z0-9-]+-desktop-720-linux\.png")
          nombres = os.listdir(carpeta)
          if not 0 < len(nombres) <= 30:
              sys.exit(f"cantidad inesperada de archivos: {len(nombres)}")
          total = 0
          for nombre in nombres:
              if not nombre_valido.fullmatch(nombre):
                  sys.exit(f"nombre inesperado: {nombre!r}")
              ruta = os.path.join(carpeta, nombre)
              if os.path.islink(ruta) or not os.path.isfile(ruta):
                  sys.exit(f"no es un archivo normal: {nombre}")
              with open(ruta, "rb") as f:
                  datos = f.read(3_000_001)
              if len(datos) > 3_000_000:
                  sys.exit(f"demasiado grande: {nombre}")
              total += len(datos)
              if datos[:8] != b"\x89PNG\r\n\x1a\n":
                  sys.exit(f"no es PNG: {nombre}")
              i, tipos = 8, []
              while i < len(datos):
                  if i + 12 > len(datos):
                      sys.exit(f"chunk truncado: {nombre}")
                  (largo,) = struct.unpack(">I", datos[i : i + 4])
                  fin = i + 12 + largo
                  if fin > len(datos):
                      sys.exit(f"chunk truncado: {nombre}")
                  (crc,) = struct.unpack(">I", datos[fin - 4 : fin])
                  if zlib.crc32(datos[i + 4 : fin - 4]) != crc:
                      sys.exit(f"CRC inválido: {nombre}")
                  tipos.append(datos[i + 4 : i + 8])
                  i = fin
                  if tipos[-1] == b"IEND":
                      break
              if i != len(datos):
                  sys.exit(f"bytes después de IEND: {nombre}")
              if not tipos or tipos[0] != b"IHDR" or tipos[-1] != b"IEND" or set(tipos) - {b"IHDR", b"IDAT", b"IEND"}:
                  sys.exit(f"chunks inesperados: {nombre}")
              if struct.unpack(">II", datos[16:24]) != (1280, 720):
                  sys.exit(f"no mide 1280x720: {nombre}")
          if total > 40_000_000:
              sys.exit(f"demasiados bytes en total: {total}")
          print(f"{len(nombres)} PNG válidas, {total} bytes")
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
      - name: Commit y push a develop
        env:
          DIR: ${{ runner.temp }}/capturas
        run: |
          set -eu
          destino=tests/e2e/capturas.spec.ts-snapshots
          rm -rf "$destino"
          mkdir -p "$destino"
          cp "$DIR"/*.png "$destino"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$destino"
          if git diff --cached --quiet; then echo "Las referencias no cambiaron."; exit 0; fi
          git commit -m "F3-09: capturas de referencia regeneradas en CI" -m "Generadas en el contenedor de Playwright desde $GITHUB_SHA."
          for i in 1 2 3; do
            if git pull --rebase origin develop && git push origin HEAD:develop; then exit 0; fi
            sleep 5
          done
          exit 1

  goldens:
    name: Goldens contra debian:stable (vigencia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:stable
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git nodejs ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node scripts/capture-goldens.mjs
      # Si el sistema real cambió (nueva versión de coreutils/bash), las salidas difieren y hay que revisar.
      - run: git diff --exit-code -- tests/golden ':(exclude)tests/golden/**/version.txt'

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  imagen:
    name: Imagen Docker de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -t rastro .
      - name: Arranca como usuario sin privilegios y responde /healthz
        run: |
          docker run -d --name rastro -p 3000:3000 rastro
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/healthz | grep -q '"ok":true'
          curl -fsSI http://127.0.0.1:3000/ | grep -qi "content-security-policy"
          test "$(docker exec rastro id -un)" = node
          # El código es de root: el proceso solo puede leerlo.
          ! docker exec rastro touch /app/dist/escritura
