name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "41 10 * * 1"

permissions:
  contents: read

jobs:
  analizar:
    # CodeQL solo es gratuito para repositorios públicos; en uno privado requiere licencia de GitHub
    # Code Security. Mientras el repo sea privado, este job se omite.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      # El repositorio no tiene code scanning habilitado: se analiza sin subir y el job falla si hay hallazgos.
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          upload: never
          output: sarif-results
      - name: Fallar si CodeQL encontró problemas
        run: |
          n=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif)
          echo "Hallazgos de CodeQL: $n"
          if [ "$n" -gt 0 ]; then
            jq -r '.runs[].results[] | "\(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' sarif-results/*.sarif
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14
