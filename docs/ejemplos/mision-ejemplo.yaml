# Ejemplo canónico de misión (T1-M2, miércoles 28 de octubre).
# El esquema formal se implementa con Zod en F2-01; este archivo debe validar contra él.
# Reglas: docs/plan/05-arquitectura.md §Esquema de misión · docs/plan/07-calidad-harness.md §Harness de contenido.

id: t1-m02-el-leeme
turno: 1
orden: 2
tipo: ticket                  # ticket | investigacion | repaso | evento | final | favor | tutorial (T0)
titulo: El LEEME
duracion_estimada_min: 4
ensena: [linux.files.cat]     # máx. 2 conceptos nuevos
requiere: [linux.nav.pwd, linux.nav.ls]
entrega: ticket               # pizarron | llamada | visita | ticket | correo
host_inicial: srv-sistemas
usuario_inicial: "{{usuario}}"   # tu usuario: el primer nombre del gafete (F4-17)
cwd_inicial: "/home/{{usuario}}"
apps: [terminal, tickets]

variables:                    # además de las variables globales de la partida
  n_tickets: { tipo: entero, min: 3, max: 6 }

mundo:
  parches:
    - tipo: archivo
      host: srv-sistemas
      ruta: "/home/{{usuario}}/LEEME.txt"
      propietario: rsalcido
      grupo: sistemas
      modo: "0644"
      modificado: "2026-10-23T23:41:00"   # reloj de juego
      contenido: |
        Para quien me reemplace:

        1. Ya te creé tu cuenta: {{usuario}}. La contraseña te la da Eduardo.
        2. Los tickets llegan a ~/tickets/. Uno por archivo.
        3. Si la impresora de la Línea 2 falla, casi siempre es el cable.

        Y una cosa más: no confíes en los números del turno nocturno.
        Revisa todo dos veces.
        — R.
    - tipo: generador          # crea {{n_tickets}} archivos T-<número>.txt con la semilla
      host: srv-sistemas
      generador: tickets_iniciales
      destino: "/home/{{usuario}}/tickets/"
      cantidad: "{{n_tickets}}"

briefing:                      # 2–4 globos, ≤ 280 caracteres cada uno
  - quien: karla
    texto: Hola, soy Karla, de Calidad. Te mandé un ticket. Necesito saber si la nota que dejó la ingeniera anterior es de ella.
  - quien: karla
    texto: Y ya de paso dime cuántos tickets tienes en tu bandeja. Quiero saber cuánto te estamos cargando.

objetivos:                     # 1–3; validación por resultado, nunca por el texto del comando
  - id: leer-leeme
    pendiente: Leer LEEME.txt
    cuando:
      archivo_leido: { host: srv-sistemas, ruta: "/home/{{usuario}}/LEEME.txt" }
    pistas:                    # Eduardo por teléfono: empujón → concepto → comando exacto
      - Para ver qué hay DENTRO de un archivo no basta con listarlo, ¿eh?
      - Hay un comando cortito que te muestra todo lo que tiene un archivo. Viene de "concatenate".
      - Teclea `cat LEEME.txt`, con mayúsculas; Linux sí las distingue.
  - id: responder-firma
    pendiente: "Ticket de Karla: ¿con qué inicial firmó la nota?"
    cuando:
      respuesta:
        donde: ticket
        esperado: "r"          # dato fijo de la historia
        acepta_tambien: ["r."]
    pistas:
      - Las firmas casi siempre van hasta abajo.
      - Vuelve a leer LEEME.txt y fíjate en la última línea.
      - La última línea de `cat LEEME.txt` dice "— R.". Contéstale R.
  - id: responder-conteo
    pendiente: "Ticket de Karla: ¿cuántos tickets hay en tu bandeja?"
    cuando:
      respuesta:
        donde: ticket
        esperado_de: { comando: "ls /home/{{usuario}}/tickets | wc -l" }   # se calcula con la semilla
    pistas:
      - Tus tickets viven en una carpeta. ¿Ya viste qué hay ahí?
      - "ls te lista lo que hay en una carpeta, aunque no estés parado en ella: ls y la ruta."
      - Teclea `ls tickets` y cuenta cuántos archivos salen.

solucion:                      # el harness la ejecuta con cada semilla (regla C2)
  - cat LEEME.txt
  - responder: { objetivo: responder-firma, valor: "R" }
  - ls tickets
  - responder: { objetivo: responder-conteo, valor: "{{respuesta.responder-conteo}}" }

soluciones_alternativas:       # también deben completar la misión (regla C3)
  - - "cat /home/{{usuario}}/LEEME.txt"
    - responder: { objetivo: responder-firma, valor: "r." }
    - "ls /home/{{usuario}}/tickets"
    - responder: { objetivo: responder-conteo, valor: "{{respuesta.responder-conteo}}" }
  - - cat ~/LEEME.txt
    - responder: { objetivo: responder-firma, valor: "R" }
    - ls ~/tickets
    - responder: { objetivo: responder-conteo, valor: "{{respuesta.responder-conteo}}" }

contraejemplos:                # NO deben cumplir el objetivo indicado (regla C4)
  - objetivo: leer-leeme
    pasos: [ls]
  - objetivo: leer-leeme
    pasos: [ls -l LEEME.txt]
  - objetivo: responder-firma
    pasos:
      - responder: { objetivo: responder-firma, valor: "Rebeca" }

libreta:                       # entradas automáticas al completar
  - pestana: comandos
    concepto: linux.files.cat
  - pestana: historia
    texto: R. dejó una nota para quien la reemplazara. Dice que no confíe en los números del turno nocturno.

recompensas:
  xp: 50
  logros: []

eventos:
  al_completar:
    - tipo: visita
      de: don_chuy
      # Un globo, o una lista de 2 a 4 globos seguidos (F4-06).
      texto:
        - ¿Que no confíes en los números?
        - Esa muchacha hablaba poco… pero nunca se equivocaba.
    - tipo: pensamiento
      texto: ¿Cuáles números? Ya me dejó con la duda.
    - tipo: flag
      nombre: leyo_leeme
